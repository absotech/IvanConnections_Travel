# R8 config tuned for Google Play's DEX optimization requirement
# (apps with > 10 MB of DEX need >= 25% shrinking, optimization and obfuscation).
#
# Do NOT add -dontoptimize / -dontobfuscate / -dontshrink here, they drop the score to 0%.
# Do NOT add "-keep class some.library.** { *; }" blankets: the .NET Android SDK already
# generates keep rules (obj/.../proguard/proguard_project_primary.cfg) for every Java type
# referenced from C#, and every AndroidX / Google AAR ships its own consumer rules.

-dontpreverify
-allowaccessmodification
-repackageclasses ''

# Attributes needed by reflection, Kotlin metadata and generics
-keepattributes Signature,InnerClasses,EnclosingMethod,Exceptions
-keepattributes *Annotation*,RuntimeVisible*Annotations,AnnotationDefault
-keepattributes SourceFile,LineNumberTable

# .NET runtime / Java callable wrappers (small, invoked by name through JNI)
-keep class mono.** { *; }
-keep class net.dot.** { *; }
-keep class crc64** { *; }

# MAUI's own Java helpers are called by name from managed code
-keep class microsoft.maui.** { *; }

# Native methods must keep their names
-keepclasseswithmembernames,includedescriptorclasses class * {
    native <methods>;
}

# Parcelable / Serializable / enums used via reflection
-keepclassmembers class * implements android.os.Parcelable {
    public static final ** CREATOR;
}
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# C# bindings read Java enum constants / static fields by name through JNI
# (e.g. EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV), R8 can't see those uses.
-keepclassmembers enum * {
    public static final <fields>;
}

# C# bindings call public members of AndroidX / Material / Maps classes by name through JNI
# (e.g. AccessibilityActionCompat.ACTION_COLLAPSE used by CommunityToolkit Expander).
# R8 can't see those calls, so keep the public API of classes that survive shrinking.
# Unused classes are still removed and everything internal is still optimized/obfuscated.
-keepclassmembers class androidx.**, com.google.android.material.**, com.google.android.gms.maps.** {
    public protected *;
}

# MAUI SecureStorage (EncryptedSharedPreferences + MasterKey) - without this sign-in fails with
# NoSuchFieldError: AES256_SIV
-keep class androidx.security.crypto.** { *; }
-keepclassmembers class * extends com.google.crypto.tink.shaded.protobuf.GeneratedMessageLite {
    <fields>;
}

# Components declared in AndroidManifest.xml are instantiated by name by the OS
# (normally covered by aapt rules, but incremental builds can miss them)
-keep public class * extends android.app.Application { <init>(); }
-keep public class * extends android.app.Activity { <init>(); }
-keep public class * extends android.app.Service { <init>(); }
-keep public class * extends android.content.BroadcastReceiver { <init>(); }
-keep public class * extends android.content.ContentProvider { <init>(); }
-keep class androidx.startup.InitializationProvider { <init>(); }

# AndroidX Startup initializers are instantiated by reflection from the manifest
-keep class * extends androidx.startup.Initializer { <init>(); }

# Strip Android logging calls from release builds
-assumenosideeffects class android.util.Log {
    public static int v(...);
    public static int d(...);
    public static int i(...);
}

-dontwarn **
